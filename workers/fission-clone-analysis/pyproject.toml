[project]
name = "fission-clone-analysis-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ai-runtime",
  "aio-pika>=9.5.7,<10",
  "jsonschema>=4.23,<5",
]

[project.scripts]
fission-clone-analysis-worker = "fission_clone_analysis.main:main"

[dependency-groups]
dev = ["pytest>=8.4.2,<10", "pytest-asyncio>=1.2,<2", "mypy>=1.18,<2", "types-jsonschema>=4.23,<5"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fission_clone_analysis"]

[tool.uv.sources]
ai-runtime = { path = "../shared/ai-runtime", editable = true }

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["fission_clone_analysis"]
